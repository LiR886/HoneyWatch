services:
  honeywatch:
    build: .
    container_name: honeywatch
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  simulator:
    build: .
    profiles: ["tools"]
    depends_on:
      honeywatch:
        condition: service_healthy
    command: ["python", "simulation/login_simulator.py", "--target", "http://honeywatch:8000/login", "--count", "15", "--delay", "0.25"]
